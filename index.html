<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0">

    <title>초고속 스캐너</title>

    <script
      src="https://unpkg.com/html5-qrcode"
      type="text/javascript">
    </script>

    <style>

        body{
            margin:0;
            padding:0;
            background:#111;
            color:#fff;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            height:100vh;
            font-family:sans-serif;
            overflow:hidden;
        }

        #reader{
            width:100%;
            max-width:500px;
            border-radius:10px;
            overflow:hidden;
        }

        .info-text{
            padding:20px;
            font-size:18px;
            font-weight:bold;
            color:#f97316;
            text-align:center;
        }

        #debug{
            width:90%;
            max-width:500px;
            font-size:12px;
            background:#222;
            padding:10px;
            margin-top:10px;
            white-space:pre-wrap;
            word-break:break-all;
            border-radius:8px;
            max-height:180px;
            overflow:auto;
        }

    </style>
</head>

<body>

<div class="info-text">
    바코드/QR을 사각형 안에 맞춰주세요
</div>

<div id="reader"></div>

<pre id="debug"></pre>

<script>

const debugEl =
    document.getElementById('debug');

function log(msg){

    console.log(msg);

    debugEl.textContent +=
        msg + '\n';
}

const urlParams =
    new URLSearchParams(window.location.search);

const returnUrl =
    urlParams.get('returnUrl');

const mode =
    urlParams.get('mode');

if(!returnUrl){

    document.querySelector('.info-text')
    .innerHTML =
        "<span style='color:red;'>잘못된 접근입니다.</span>";

} else {

    startScanner();
}

async function startScanner(){

    try{

        log('===== START =====');

        log(
            'HTTPS: ' +
            window.isSecureContext
        );

        log(
            'mediaDevices: ' +
            typeof navigator.mediaDevices
        );

        if(!navigator.mediaDevices){

            throw new Error(
                'mediaDevices unsupported'
            );
        }

        const devices =
            await navigator
            .mediaDevices
            .enumerateDevices();

        log(
            JSON.stringify(
                devices,
                null,
                2
            )
        );

        const html5QrCode =
            new Html5Qrcode("reader");

        const cameras =
            await Html5Qrcode.getCameras();

        log(
            'CAMERAS: ' +
            JSON.stringify(cameras)
        );

        if(!cameras.length){

            throw new Error(
                '카메라를 찾을 수 없습니다.'
            );
        }

        // 가장 후면 카메라 추정
        let cameraId =
            cameras[0].id;

        const backCam =
            cameras.find(cam => {

                const label =
                    cam.label.toLowerCase();

                return (
                    label.includes('back') ||
                    label.includes('rear') ||
                    label.includes('environment')
                );
            });

        if(backCam){

            cameraId = backCam.id;
        }

        log(
            'SELECT CAMERA: ' +
            cameraId
        );

        const config = {

            fps:10,

            qrbox:{
                width:250,
                height:250
            },

            rememberLastUsedCamera:true,

            aspectRatio:1.7778
        };

        await html5QrCode.start(

            cameraId,

            config,

            async(decodedText)=>{

                log(
                    'SCAN SUCCESS: ' +
                    decodedText
                );

                try{

                    navigator.vibrate?.(200);

                }catch(e){}

                await html5QrCode.stop();

                window.location.href =
                    returnUrl +
                    "?scannedValue=" +
                    encodeURIComponent(decodedText) +
                    "&mode=" +
                    encodeURIComponent(mode);

            },

            ()=>{}
        );

        log('SCANNER STARTED');

    } catch(err){

        console.error(err);

        log('===== ERROR =====');

        log(
            'NAME: ' +
            err.name
        );

        log(
            'MESSAGE: ' +
            err.message
        );

        log(
            'STACK: ' +
            err.stack
        );

        document.querySelector('.info-text')
        .innerHTML = `
            <span style='color:red;'>
            카메라 시작 실패<br><br>
            ${err.name}<br>
            ${err.message}
            </span>
        `;
    }
}

</script>

</body>
</html>
