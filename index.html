<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0">

    <title>초고속 스캐너</title>

    <script
      src="https://unpkg.com/html5-qrcode"
      type="text/javascript">
    </script>

    <style>

        body{
            margin:0;
            padding:0;
            background:#111;
            color:#fff;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            height:100vh;
            font-family:sans-serif;
            overflow:hidden;
        }

        #reader{
            width:100%;
            max-width:500px;
            border-radius:10px;
            overflow:hidden;
        }

        .info-text{
            padding:20px;
            font-size:18px;
            font-weight:bold;
            color:#f97316;
            text-align:center;
        }

    </style>
</head>

<body>

<div class="info-text">
    바코드/QR을 사각형 안에 맞춰주세요
</div>

<div id="reader"></div>

<script>

const urlParams =
    new URLSearchParams(window.location.search);

const returnUrl =
    urlParams.get('returnUrl');

const mode =
    urlParams.get('mode');

// 테스트용 기본값
const finalReturnUrl =
    returnUrl || 'https://google.com';

startScanner();

async function startScanner(){

    try{

        const html5QrCode =
            new Html5Qrcode("reader");

        const cameras =
            await Html5Qrcode.getCameras();

        if(!cameras.length){

            throw new Error(
                '카메라를 찾을 수 없습니다.'
            );
        }

        // 후면 카메라 우선 선택
        let cameraId =
            cameras[0].id;

        const backCam =
            cameras.find(cam => {

                const label =
                    cam.label.toLowerCase();

                return (
                    label.includes('back') ||
                    label.includes('rear') ||
                    label.includes('environment')
                );
            });

        if(backCam){

            cameraId = backCam.id;
        }

        let scanned = false;

        const config = {

            fps:10,

            qrbox:{
                width:250,
                height:250
            },

            rememberLastUsedCamera:true,

            aspectRatio:1.7778
        };

        await html5QrCode.start(

            cameraId,

            config,

            async(decodedText)=>{

                // 중복 스캔 방지
                if(scanned) return;
                scanned = true;

                try{ navigator.vibrate?.(200); }catch(e){}

                document.querySelector('.info-text').innerHTML = "✓ 스캔 완료!";

                // 카메라 즉시 중지
                try{ await html5QrCode.stop(); }catch(e){}

                try{
                    if(window.opener && !window.opener.closed){
                        // [경로1] 새 탭으로 열린 경우 — postMessage (페이지 이동 없음)
                        window.opener.postMessage({
                            _barcodeResult: true,
                            scannedValue: decodedText,
                            scannedMode: mode || 'barcode'
                        }, '*');
                        document.querySelector('.info-text').innerHTML = "✓ 결과 전달 완료<br>창을 닫습니다";
                        setTimeout(()=>{ window.close(); }, 800);
                    } else {
                        // [경로2] 같은 탭 — URL 이동 (흰 화면 불가피)
                        const sep = finalReturnUrl.includes('?') ? '&' : '?';
                        window.location.href = finalReturnUrl + sep
                            + "scannedValue=" + encodeURIComponent(decodedText)
                            + "&scannedMode=" + encodeURIComponent(mode || 'barcode');
                    }
                }catch(err){
                    alert('결과 전달 중 오류: ' + err.message);
                }

            },

            ()=>{}
        );

    } catch(err){

        console.error(err);

        document.querySelector('.info-text')
        .innerHTML = `
            <span style='color:red;'>
            카메라 시작 실패<br><br>
            ${err.message}
            </span>
        `;
    }
}

</script>

</body>
</html>
